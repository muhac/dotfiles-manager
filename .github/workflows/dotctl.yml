name: Test dotctl

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build dotctl
        run: cargo build --manifest-path dotctl/Cargo.toml

      - name: Run dotctl
        run: |
          output="$(cargo run --quiet --manifest-path dotctl/Cargo.toml)"
          echo "$output"
          test "$output" = "Hello, world!"
