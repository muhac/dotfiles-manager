targets:
  codex:
    format: toml
    source: dotfiles/codex/.codex/config.sync.toml
    target: ~/.codex/config.toml
    sync:
      - project_doc_fallback_filenames
      - project_doc_max_bytes
      - developer_instructions
      - notice.hide_rate_limit_model_nudge
      - tui.notification_condition
      - tui.theme
      - tui.status_line
      - plugins."github@openai-curated".enabled

  git:
    format: gitconfig
    source: dotfiles/git/git.sync.gitconfig
    target: ~/.gitconfig
    sync:
      - core.editor
      - init.defaultBranch
      - push.autoSetupRemote
      - pull.rebase
      - rebase.autoStash
      - merge.conflictstyle
      - rerere.enabled
      - diff.algorithm
      - diff.colorMoved
      - fetch.prune
