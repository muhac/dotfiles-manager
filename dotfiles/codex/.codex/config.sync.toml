project_doc_fallback_filenames = ["CLAUDE.md"]
project_doc_max_bytes = 65536
developer_instructions = """
When Codex creates a git commit:
- Use a conventional-commit subject.
- Include a commit body for non-trivial changes. Explain the motivation, the key implementation details, and the validation performed.
- Include this trailer: Co-authored-by: Codex <noreply@openai.com>.

When Codex uses the GitHub CLI (`gh`), run it outside the sandbox by requesting escalation with `sandbox_permissions = "require_escalated"`. This avoids recurring sandbox, network, and authentication failures.
"""

[notice]
hide_rate_limit_model_nudge = true

[tui]
notification_condition = "always"
theme = "monokai-extended"
status_line = ["task-progress", "git-branch", "model-with-reasoning", "used-tokens", "total-input-tokens", "total-output-tokens", "context-remaining", "five-hour-limit", "weekly-limit"]

[plugins."github@openai-curated"]
enabled = true
